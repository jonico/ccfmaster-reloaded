# Hibernate Validator 6 reworded the built-in constraint messages: @NotNull went from
# "may not be null" (Validator 4.x, which this application was written against) to
# "must not be null". Those messages are user-visible - they are rendered in the web UI and
# returned by the REST API - and MappingRulesTest asserts on the exact text, so the
# original wording is pinned here rather than letting the upgrade change it. Bean
# Validation resolves ValidationMessages.properties ahead of the provider's own bundle.
#
# Only the constraints this application actually uses are listed.
jakarta.validation.constraints.NotNull.message = may not be null
jakarta.validation.constraints.Size.message   = size must be between {min} and {max}
jakarta.validation.constraints.Pattern.message = must match "{regexp}"
